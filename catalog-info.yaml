apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gatling-amqp-plugin
  description: AMQP protocol plugin for Gatling load testing, supporting publish, request-reply, and consume flows with connection pooling
  annotations:
    github.com/project-slug: galax-io/gatling-amqp-plugin
    galaxio.io/plans.docker-images: "runtime: CI runs the example simulations in the Gatling runtime image"
    galaxio.io/uses.spec-kit-galaxio-bootstrap: "process: created from the template, takes process updates via copier update"
spec:
  type: library
  lifecycle: production
  owner: galaxio
  dependsOn:
    - component:default/spec-kit-galaxio-bootstrap
