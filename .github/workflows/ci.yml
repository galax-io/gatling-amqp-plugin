name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBT_OPTS: -Dsbt.color=true -Dsbt.log.noformat=false -Dsbt.supershell=false
  JAVA_OPTS: -Xms2G -Xmx2G -Xss4M -XX:+UseG1GC
  JVM_OPTS: -Xms2G -Xmx2G -Xss4M -XX:+UseG1GC
  FORCE_COLOR: "1"
  TERM: xterm-256color

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache Coursier
        uses: coursier/cache-action@v8
      - name: Scalafmt Check
        run: sbt scalafmtCheckAll scalafmtSbtCheck

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    needs: [format]
    permissions:
      contents: read
      checks: write
    timeout-minutes: 20
    strategy:
      matrix:
        java: ['17', '21']
    services:
      rabbitmq:
        image: rabbitmq:4.1.8-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: rabbitmq
          RABBITMQ_DEFAULT_PASS: rabbitmq
          RABBITMQ_DEFAULT_VHOST: "/"
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java (Temurin ${{ matrix.java }})
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # Only dependency caches are restored. sbt 2 caches task results in
      # ~/.cache/sbt and runs tests incrementally, so neither that cache nor
      # target/ may come back from an earlier run, or tests could be skipped.
      - name: Cache Coursier
        uses: coursier/cache-action@v8
      - name: Discard sbt 2 task cache
        run: rm -rf ~/.cache/sbt target project/target
      - name: Compile
        run: sbt clean compile
      # Blocking check against 1.3.0, run by the sbt 2 build of sbt-mima-plugin.
      - name: Binary compatibility (MiMa)
        run: sbt mimaReportBinaryIssues
      - name: Unit Tests with Coverage
        run: sbt coverage test coverageReport coverageOff
      - name: Integration Tests (Gatling)
        run: sbt "Gatling / testOnly org.galaxio.gatling.amqp.examples.AmqpGatlingTest"
      - name: Upload coverage reports to Codecov
        if: matrix.java == '17'
        uses: codecov/codecov-action@v7
        with:
          files: target/out/jvm/scala-2.13.18/gatling-amqp-plugin/scoverage-report/scoverage.xml
          fail_ci_if_error: false

  sbt-upgrade-parity:
    name: sbt Upgrade Parity
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: galax-io/gatling-picatinny/.github/workflows/sbt-upgrade-parity.yml@4a4d8413b0a593927efc560198da3452fecee8cd
    with:
      mode: library
